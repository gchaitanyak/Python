<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join a group — Python Exercises</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <!-- @header -->
    <main id="main" tabindex="-1" class="container auth">
      <h1>Join a group</h1>
      <p data-loading>Checking your invite…</p>
      <div class="alert" data-status role="status" aria-live="polite" hidden></div>
      <div class="card" data-invite hidden>
        <p>You’ve been invited to join <strong data-group-name></strong> (<span data-group-size></span>).</p>
        <p class="help-text">Your group’s admins will see your username, the lessons you complete, your accuracy and when you were last active. You can leave the group at any time from your account page.</p>
        <button class="btn btn--primary" type="button" data-join>Join group</button>
      </div>
    </main>
    <!-- @footer -->
  </body>
</html>
